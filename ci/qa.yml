name: QA

# CAS-236: the gate. Every push to staging rebuilds the app and runs the whole QA footprint against the
# build it just made; promote.yml refuses to promote a staging commit whose QA run is not green (see
# ci/README.md for that half). Nothing here touches main, and nothing here needs a secret: the suites are
# offline by construction — the engine harness runs the built index.html in node's vm, the e2e suite serves
# it with python's own http.server and blocks every outbound request, and the monitor runs --dry-run.
#
# NOT INSTALLED YET. This file lives in ci/ because the CC autonomy contract bars CC from writing
# .github/workflows/*. Move it to .github/workflows/qa.yml to turn it on.

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging, main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # One run per branch, and cancel a superseded one: the answer that matters is about the newest commit.
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test tooling
        run: npm ci

      # The suite pins @playwright/test to exactly 1.60.0, and this installs the chromium build that
      # release ships with — so the browser always matches the client, which is the mismatch CAS-236 warns
      # about. --with-deps pulls the shared libraries the GitHub image does not carry by default.
      - name: Install the matching browser
        run: npx playwright install --with-deps chromium

      # Build FIRST and always. Every suite below tests the built index.html, so running them against the
      # committed build would test whatever the last person to run the pipeline had on their machine.
      - name: Build the app
        run: python poc_pipeline.py --build-html

      # A build that changes index.html means the commit under test shipped a stale one — the exact fault
      # CAS-231 had to be reopened for. The build stamp moves on every build by design, so it is excluded.
      - name: Fail if the committed build was stale
        run: |
          set -euo pipefail
          if ! git diff --quiet -- index.html; then
            drift=$(git diff -U0 -- index.html | grep -E '^[+-]' | grep -vE '^[+-]{3}' | grep -vc 'BUILD_INFO' || true)
            git diff --stat -- index.html
            if [ "$drift" -gt 0 ]; then
              echo "::error::index.html is $drift lines behind app_template.html - rebuild and commit it"
              exit 1
            fi
            echo "index.html differs only by its build stamp, which is expected."
          fi

      - name: Engine invariants + data integrity
        run: npm run test:engine

      - name: Catalogue data quality
        run: npm run test:data

      - name: Monitor
        run: |
          npm run test:monitor
          python -m monitor --dry-run

      - name: End to end
        run: npm run test:e2e

      - name: Keep the report when it goes red
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
