<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cascade — Splash (Screen 1)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap');
  :root{
    --grad:linear-gradient(135deg,#7C5CFF 0%,#4C7DFF 52%,#22D3EE 100%);
    --bg:#0A0E1A; --panel:#141A2A; --line:#2a303b;
    --ink:#e8ecf2; --dim:#9aa4b2; --faint:#8b95a5;
    --amber:#f0a336; --blue:#5aa9f0; --green:#48c78e; --grey:#6b7280;
    --fb:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --fd:"Poppins",var(--fb);
  }
  *{box-sizing:border-box}
  body{margin:0;background:#05070d;font-family:var(--fb);display:flex;justify-content:center;padding:24px 0}
  .phone{position:relative;width:340px;min-height:648px;color:var(--ink);
    background:radial-gradient(120% 60% at 50% 8%,#141b30 0%,#0A0E1A 46%,#080b14 100%);
    border:1px solid var(--line);border-radius:34px;padding:44px 22px 30px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
  .phone::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
    background-image:
      radial-gradient(2.4px 2.4px at 34px 44px, rgba(255,255,255,.95), transparent),
      radial-gradient(3px 3px at 250px 30px, rgba(150,120,255,.9), transparent),
      radial-gradient(2px 2px at 300px 66px, rgba(170,210,255,.85), transparent),
      radial-gradient(1.6px 1.6px at 72px 120px, rgba(255,255,255,.7), transparent),
      radial-gradient(1.6px 1.6px at 128px 74px, rgba(255,255,255,.6), transparent),
      radial-gradient(2.4px 2.4px at 205px 150px, rgba(52,210,245,.8), transparent),
      radial-gradient(1.6px 1.6px at 165px 22px, rgba(255,255,255,.8), transparent),
      radial-gradient(1.6px 1.6px at 44px 205px, rgba(255,255,255,.55), transparent),
      radial-gradient(2px 2px at 312px 220px, rgba(255,255,255,.6), transparent),
      radial-gradient(1.6px 1.6px at 284px 178px, rgba(170,210,255,.5), transparent),
      radial-gradient(1.6px 1.6px at 94px 300px, rgba(255,255,255,.45), transparent),
      radial-gradient(2px 2px at 232px 322px, rgba(255,255,255,.5), transparent),
      radial-gradient(1.4px 1.4px at 22px 384px, rgba(255,255,255,.4), transparent),
      radial-gradient(1.6px 1.6px at 318px 404px, rgba(255,255,255,.45), transparent),
      radial-gradient(1.4px 1.4px at 150px 250px, rgba(255,255,255,.38), transparent),
      radial-gradient(1.6px 1.6px at 200px 470px, rgba(255,255,255,.4), transparent),
      radial-gradient(1.4px 1.4px at 60px 520px, rgba(255,255,255,.32), transparent);}
  .stack{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center;min-height:100%}
  .logo{filter:drop-shadow(0 0 14px rgba(124,92,255,.55));margin-top:6px}
  .wordmark{margin:16px 0 24px;font-family:var(--fb);font-weight:500;letter-spacing:.44em;font-size:19px;padding-left:.44em;color:#fff}
  h1{font-family:var(--fd);font-size:23px;line-height:1.22;font-weight:700;margin:0 0 22px;color:var(--ink)}
  .loz{display:flex;flex-wrap:nowrap;justify-content:center;gap:5px;margin-bottom:28px}
  .pill{display:inline-flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:999px;
    padding:4px 8px;font-size:10px;color:var(--dim);white-space:nowrap}
  .d{width:5px;height:5px;border-radius:50%;flex:0 0 auto}
  .bullets{width:100%;display:flex;flex-direction:column;gap:16px;margin-bottom:22px}
  .b{display:flex;gap:12px;align-items:flex-start;text-align:left}
  .tick{flex:0 0 auto;width:20px;height:20px;margin-top:1px}
  .b span{font-size:15px;line-height:1.4;font-weight:500;color:var(--ink)}
  .spacer{flex:1}
  .ns{font-size:13.5px;line-height:1.5;color:var(--dim);margin:6px 4px 16px;text-align:center}
  .cta{width:100%;border:0;border-radius:13px;padding:16px;font-family:var(--fd);font-weight:700;font-size:16px;cursor:pointer;
    background:var(--grad);color:#fff;box-shadow:0 10px 34px rgba(124,92,255,.34)}
</style>
</head>
<body>
  <div class="phone">
    <div class="stack">
      <svg class="logo" width="84" height="84" viewBox="0 0 120 120" fill="none">
        <defs><linearGradient id="cg" x1="10" y1="18" x2="104" y2="104" gradientUnits="userSpaceOnUse">
          <stop stop-color="#7C5CFF"/><stop offset=".55" stop-color="#4C7DFF"/><stop offset="1" stop-color="#22D3EE"/>
        </linearGradient></defs>
        <path d="M88 33 A35 35 0 1 0 88 87" stroke="url(#cg)" stroke-width="13" stroke-linecap="round" fill="none"/>
        <circle cx="90" cy="30" r="6.5" fill="#22D3EE"/>
        <path d="M51 45 L51 75 L79 60 Z" fill="#EAF1FF"/>
      </svg>

      <div class="wordmark">CASCADE</div>
      <h1>Your own movie<br>search agents</h1>

      <div class="loz">
        <span class="pill"><span class="d" style="background:var(--grey)"></span>Upcoming</span>
        <span class="pill"><span class="d" style="background:var(--amber)"></span>In cinemas</span>
        <span class="pill"><span class="d" style="background:var(--blue)"></span>Rental</span>
        <span class="pill"><span class="d" style="background:var(--green)"></span>Streaming</span>
      </div>

      <div class="bullets">
        <div class="b"><svg class="tick" viewBox="0 0 24 24" fill="none"><path d="M4 12.5l5 5L20 6.5" stroke="#22D3EE" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>finds movies you'll love</span></div>
        <div class="b"><svg class="tick" viewBox="0 0 24 24" fill="none"><path d="M4 12.5l5 5L20 6.5" stroke="#22D3EE" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>follows them across cinema, rental and streaming</span></div>
        <div class="b"><svg class="tick" viewBox="0 0 24 24" fill="none"><path d="M4 12.5l5 5L20 6.5" stroke="#22D3EE" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>and gives you the viewing inside track</span></div>
      </div>

      <div class="spacer"></div>
      <p class="ns">Never miss a film worth watching — and always know where to watch it.</p>
      <button class="cta">Select your first agent</button>
    </div>
  </div>
</body>
</html>
