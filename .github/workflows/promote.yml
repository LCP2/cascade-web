# .github/workflows/promote.yml — Codynamics Development Standard (Cascade web)
# The shipper. Fires automatically when qa.yml succeeds on staging — no tag, no human step.
# main is written ONLY here. Pages source is "Deploy from a branch: main", so pushing main
# IS the production deploy (the built-in Pages pipeline publishes cascademovies.com). We do
# NOT use upload-pages-artifact/deploy-pages — that is only for Pages source = GitHub Actions.
name: promote

on:
  workflow_run:
    workflows: [qa]
    types: [completed]
    branches: [staging]

permissions:
  contents: write

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci

      - name: Merge the QA'd staging commit into main
        id: merge
        run: |
          set -euo pipefail
          git config user.name  "ci-promote"
          git config user.email "ci@codynamics.com.au"
          before=$(git rev-parse HEAD)
          echo "before=$before" >> "$GITHUB_OUTPUT"
          git merge --no-ff "${{ github.event.workflow_run.head_sha }}" \
            -m "promote: staging@${{ github.event.workflow_run.head_sha }}"

      - name: Bump patch version and rebuild for production
        id: ver
        env:
          CASCADE_ENV: production
        run: |
          set -euo pipefail
          cur=$(tr -d ' \n' < VERSION)
          IFS='.' read -r MA MI PA <<< "$cur"
          new="${MA}.${MI}.$((PA+1))"
          echo "$new" > VERSION
          python poc_pipeline.py --build-html
          git add VERSION index.html version.json
          git commit -m "release ${new}"
          echo "version=${new}" >> "$GITHUB_OUTPUT"

      - name: Push main — the production deploy (main -> Pages)
        run: git push origin main

      - name: Close the board — Done + v<version> on every ticket that shipped
        env:
          JIRA_BASE_URL:  ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL:     ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          RANGE_FROM:     ${{ steps.merge.outputs.before }}
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: python ci/close_shipped.py
