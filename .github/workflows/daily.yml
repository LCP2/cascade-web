name: Daily AU movie refresh + Cascade monitor

# Once a day in the cloud: rebuild today's AU catalogue, commit the refreshed app + data
# (so GitHub Pages serves the latest AND git history carries "yesterday" for the diff), then
# run the Cascade monitor — diff today vs yesterday, match to each user's Cascades, de-dupe,
# and email one digest per user via Resend. Also runnable on demand from the Actions tab.
#
# Secrets are read from GitHub Actions secrets only (never hardcoded). When the Supabase +
# Resend secrets are absent (e.g. a first manual run before you've added them), the monitor
# runs in --dry-run so the workflow still passes.

on:
  schedule:
    - cron: "0 20 * * *"        # 20:00 UTC ≈ 6–7am Sydney. Fixed to UTC; drifts 1h with AU daylight saving.
  workflow_dispatch:             # manual "Run workflow" button
    inputs:
      days_back:
        description: "Demo: diff the monitor against the catalogue this many days ago so real transitions fire and a digest actually sends (for building/validating the notification UX). 0 = normal ~yesterday behaviour."
        required: false
        default: "0"
      baseline_ref:
        description: "Demo (advanced): diff against this exact git ref's movies.json. Overrides days_back. Blank = use days_back."
        required: false
        default: ""

permissions:
  contents: write                # allow the job to commit the refreshed files
  actions: write                 # CAS-523: allow dispatching qa.yml at the end of this run

concurrency:                     # never let two daily runs overlap
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo (carries yesterday's state for change-detection)
        uses: actions/checkout@v4
        with:
          ref: staging           # the repo's default branch is main; refresh must land on staging, never main
          fetch-depth: 0         # full history: the monitor anchors "yesterday" to the last refresh on an EARLIER day, not HEAD~1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build today's catalogue (ingest → enrich → poll → derive → build)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          WATCHMODE_API_KEY: ${{ secrets.WATCHMODE_API_KEY }}
        run: python poc_pipeline.py

      - name: Commit refreshed app + data (this becomes "today" for tomorrow's diff)
        run: |
          git config user.name  "cascade-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html movies.json state
          git commit -m "Daily refresh $(date -u +%F)" || echo "nothing to commit"
          git push origin HEAD:staging || echo "nothing to push"

      - name: Live-size the catalogue (CAS-354 — TMDB discover total_results)
        # Current-scope vs widened-AU-watchable totals, straight from TMDB discover. The TMDB
        # key only exists here (never on the dev PC), so this step is the only place it can run.
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          python scripts/catalogue_sizing.py
          git config user.name  "cascade-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/appraisals/cas-catalogue-sizing.md
          git commit -m "CAS-354: catalogue sizing $(date -u +%F)" || echo "nothing to commit"
          git push origin HEAD:staging || echo "nothing to push"

      - name: Run the Cascade monitor (diff → match → de-dupe → email)
        # Reads yesterday's catalogue from git history (last refresh on an earlier calendar day). With the Supabase +
        # Resend secrets present it does the real thing; without them it runs --dry-run so the
        # workflow still passes (no writes, no email).
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CASCADE_EMAIL_FROM: ${{ secrets.CASCADE_EMAIL_FROM }}   # optional; defaults to Resend's test sender
          CASCADE_SITE_URL: ${{ secrets.SITE_URL }}               # optional; defaults to the live Pages URL
          DAYS_BACK: ${{ github.event.inputs.days_back }}          # demo look-back (0/blank on schedule)
          BASELINE_REF: ${{ github.event.inputs.baseline_ref }}    # demo exact-ref override
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}                 # CAS-483: without these four, push silently no-ops
          APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
          APNS_AUTH_KEY: ${{ secrets.APNS_AUTH_KEY }}
          APNS_BUNDLE_ID: ${{ secrets.APNS_BUNDLE_ID }}
        run: |
          # Demo look-back (CAS-417 follow-on): a manual run can diff against an OLDER catalogue so real
          # transitions fire and a digest actually sends — for building/validating the notification UX.
          # Scheduled runs pass no inputs, so DAYS_BACK is blank/0 and behaviour is unchanged.
          BASELINE_ARGS=""
          REF="$BASELINE_REF"
          if [ -z "$REF" ] && [ -n "$DAYS_BACK" ] && [ "$DAYS_BACK" != "0" ]; then
            CUTOFF=$(date -u -d "$DAYS_BACK days ago" +%Y-%m-%d)
            REF=$(git log --format="%H %cd" --date=format:%Y-%m-%d -- movies.json | awk -v c="$CUTOFF" '$2 <= c {print $1; exit}')
            echo "days_back=$DAYS_BACK -> cutoff $CUTOFF -> baseline commit ${REF:-<none found>}"
          fi
          if [ -n "$REF" ]; then
            git show "$REF:movies.json" > /tmp/prev.json && BASELINE_ARGS="--yesterday /tmp/prev.json"
            echo "DEMO baseline: $REF ($(wc -l < /tmp/prev.json) lines)"
          fi
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] && [ -n "$RESEND_API_KEY" ]; then
            echo "Secrets present — live run (will send digests + write the notifications ledger)."
            python -m monitor $BASELINE_ARGS
          else
            echo "Supabase/Resend secrets absent — running --dry-run (no writes, no email)."
            python -m monitor --dry-run $BASELINE_ARGS
          fi

      - name: Dispatch qa.yml (CAS-523)
        # The commits above were pushed with the default GITHUB_TOKEN, so GitHub's anti-recursion
        # protection silently suppresses qa.yml's `push` trigger for them — meaning promote.yml's
        # gate would never fire for a daily-refresh-only push. An explicit API dispatch is not
        # subject to that suppression, so this keeps main from drifting behind a staging refresh
        # that has no other ticket push to piggyback on.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run qa.yml --ref staging
