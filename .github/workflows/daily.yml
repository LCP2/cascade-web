name: Daily AU movie refresh + Cascade monitor

# Once a day in the cloud: rebuild today's AU catalogue, commit the refreshed app + data
# (so GitHub Pages serves the latest AND git history carries "yesterday" for the diff), then
# run the Cascade monitor — diff today vs yesterday, match to each user's Cascades, de-dupe,
# and email one digest per user via Resend. Also runnable on demand from the Actions tab.
#
# Secrets are read from GitHub Actions secrets only (never hardcoded). When the Supabase +
# Resend secrets are absent (e.g. a first manual run before you've added them), the monitor
# runs in --dry-run so the workflow still passes.

on:
  schedule:
    - cron: "0 20 * * *"        # 20:00 UTC ≈ 6–7am Sydney. Fixed to UTC; drifts 1h with AU daylight saving.
  workflow_dispatch:             # manual "Run workflow" button
    inputs:
      days_back:
        description: "Demo: diff the monitor against the catalogue this many days ago so real transitions fire and a digest actually sends (for building/validating the notification UX). 0 = normal ~yesterday behaviour."
        required: false
        default: "0"
      baseline_ref:
        description: "Demo (advanced): diff against this exact git ref's movies.json. Overrides days_back. Blank = use days_back."
        required: false
        default: ""
      probe_title:
        description: "CAS-607 diagnostic: probe TMDB for one title (why isn't it in the catalogue?) instead of the daily refresh. Prints candidates + AU release dates + AU providers + an ingest verdict, then exits — no ingest, no commit, no monitor, no qa.yml dispatch. Blank = normal refresh. (Only appears in the Actions UI once this input has reached main via a promote.)"
        required: false
        default: ""

permissions:
  contents: write                # allow the job to commit the refreshed files
  actions: write                 # CAS-523: allow dispatching qa.yml at the end of this run

concurrency:                     # never let two daily runs overlap
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo (carries yesterday's state for change-detection)
        uses: actions/checkout@v4
        with:
          ref: staging           # the repo's default branch is main; refresh must land on staging, never main
          fetch-depth: 0         # full history: the monitor anchors "yesterday" to the last refresh on an EARLIER day, not HEAD~1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Probe a title (CAS-607)
        # Diagnostic-only mode: when probe_title is set, run ONLY the probe against TMDB and
        # exit — no ingest, no commit, no monitor, no qa.yml dispatch. Every step below is
        # skipped for this run.
        if: ${{ github.event.inputs.probe_title != '' }}
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          PROBE_TITLE: ${{ github.event.inputs.probe_title }}
        run: python scripts/catalogue_sizing.py --probe "$PROBE_TITLE"

      - name: Build today's catalogue (ingest → enrich → poll → derive → build)
        if: ${{ github.event.inputs.probe_title == '' }}
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          WATCHMODE_API_KEY: ${{ secrets.WATCHMODE_API_KEY }}
        run: python poc_pipeline.py

      - name: Commit refreshed app + data (this becomes "today" for tomorrow's diff)
        if: ${{ github.event.inputs.probe_title == '' }}
        run: |
          git config user.name  "cascade-bot"
          git config user.email "actions@users.noreply.github.com"
          # CAS-758: a rebase-based retry here structurally conflicted whenever the CC-web worker
          # pushed during the ~19-minute build (the normal case, not a rare race), since its own
          # `npm run build` touches this exact same index.html. `git reset --soft` onto the
          # current remote tip never conflicts: it just re-parents this commit onto whatever is
          # there now. The non-owned-path sync (git checkout HEAD -- . ':!...') pulls in any
          # template/source change the remote made, so the rebuild below is always against the
          # CURRENT app_template.html, not a stale one — see scripts/reset_soft_and_push.sh for
          # the same algorithm's standalone, tested form.
          attempt=1
          pushed=0
          while [ "$attempt" -le 3 ]; do
            git fetch origin staging
            if ! git reset --soft origin/staging; then
              echo "::error::git reset --soft onto origin/staging failed"
              exit 1
            fi
            git checkout HEAD -- . ':!index.html' ':!movies.json' ':!state'
            python poc_pipeline.py --build-html
            git add index.html movies.json state
            git commit -m "Daily refresh $(date -u +%F)" || echo "nothing to commit"
            if git push origin HEAD:staging; then
              pushed=1
              break
            fi
            echo "push rejected (attempt $attempt/3), retrying after reset + rebuild"
            attempt=$((attempt + 1))
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::failed to push to staging after 3 attempts"
            exit 1
          fi

      - name: Live-size the catalogue (CAS-354 — TMDB discover total_results)
        # Current-scope vs widened-AU-watchable totals, straight from TMDB discover. The TMDB
        # key only exists here (never on the dev PC), so this step is the only place it can run.
        if: ${{ github.event.inputs.probe_title == '' }}
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          python scripts/catalogue_sizing.py
          git config user.name  "cascade-bot"
          git config user.email "actions@users.noreply.github.com"
          # CAS-758: same reset-soft-and-rebuild retry as the "Commit refreshed app + data" step
          # above — the rebuild here is defensive (this step's own diff is only the sizing
          # report), keeping index.html perpetually rebuilt against whatever app_template.html is
          # on staging by the time this step pushes.
          attempt=1
          pushed=0
          while [ "$attempt" -le 3 ]; do
            git fetch origin staging
            if ! git reset --soft origin/staging; then
              echo "::error::git reset --soft onto origin/staging failed"
              exit 1
            fi
            git checkout HEAD -- . ':!docs/appraisals/cas-catalogue-sizing.md'
            python poc_pipeline.py --build-html
            git add docs/appraisals/cas-catalogue-sizing.md
            git commit -m "CAS-354: catalogue sizing $(date -u +%F)" || echo "nothing to commit"
            if git push origin HEAD:staging; then
              pushed=1
              break
            fi
            echo "push rejected (attempt $attempt/3), retrying after reset + rebuild"
            attempt=$((attempt + 1))
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::failed to push to staging after 3 attempts"
            exit 1
          fi

      - name: Set up Node (CAS-825 — the monitor calls the shipped engine via admit_shim.mjs)
        if: ${{ github.event.inputs.probe_title == '' }}
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Run the Cascade monitor (diff → match → de-dupe → email)
        # Reads yesterday's catalogue from git history (last refresh on an earlier calendar day). With the Supabase +
        # Resend secrets present it does the real thing; without them it runs --dry-run so the
        # workflow still passes (no writes, no email). CAS-825: matching now shells out once to
        # admit_shim.mjs, which loads index.html (already rebuilt above) via tests/js/engine.mjs —
        # Node must be on PATH before this step runs.
        if: ${{ github.event.inputs.probe_title == '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CASCADE_EMAIL_FROM: ${{ secrets.CASCADE_EMAIL_FROM }}   # optional; defaults to Resend's test sender
          CASCADE_SITE_URL: ${{ secrets.SITE_URL }}               # optional; defaults to the live Pages URL
          DAYS_BACK: ${{ github.event.inputs.days_back }}          # demo look-back (0/blank on schedule)
          BASELINE_REF: ${{ github.event.inputs.baseline_ref }}    # demo exact-ref override
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}                 # CAS-483: without these four, push silently no-ops
          APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
          APNS_AUTH_KEY: ${{ secrets.APNS_AUTH_KEY }}
          APNS_BUNDLE_ID: ${{ secrets.APNS_BUNDLE_ID }}
        run: |
          # Demo look-back (CAS-417 follow-on): a manual run can diff against an OLDER catalogue so real
          # transitions fire and a digest actually sends — for building/validating the notification UX.
          # Scheduled runs pass no inputs, so DAYS_BACK is blank/0 and behaviour is unchanged.
          BASELINE_ARGS=""
          REF="$BASELINE_REF"
          if [ -z "$REF" ] && [ -n "$DAYS_BACK" ] && [ "$DAYS_BACK" != "0" ]; then
            CUTOFF=$(date -u -d "$DAYS_BACK days ago" +%Y-%m-%d)
            REF=$(git log --format="%H %cd" --date=format:%Y-%m-%d -- movies.json | awk -v c="$CUTOFF" '$2 <= c {print $1; exit}')
            echo "days_back=$DAYS_BACK -> cutoff $CUTOFF -> baseline commit ${REF:-<none found>}"
          fi
          if [ -n "$REF" ]; then
            git show "$REF:movies.json" > /tmp/prev.json && BASELINE_ARGS="--yesterday /tmp/prev.json"
            echo "DEMO baseline: $REF ($(wc -l < /tmp/prev.json) lines)"
          fi
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] && [ -n "$RESEND_API_KEY" ]; then
            echo "Secrets present — live run (will send digests + write the notifications ledger)."
            python -m monitor $BASELINE_ARGS
          else
            echo "Supabase/Resend secrets absent — running --dry-run (no writes, no email)."
            python -m monitor --dry-run $BASELINE_ARGS
          fi

      - name: Persist the held-ids snapshot (CAS-986)
        # The monitor step above just wrote state/user_held_ids.json (a real run only — --dry-run
        # writes nothing, so there is nothing new to commit then). It runs AFTER both of this
        # workflow's earlier commit steps, so without this step the file would never reach
        # staging — poc_pipeline.py's next run reads it off disk, not Supabase directly. Same
        # bounded fetch/reset-soft/push retry as the two earlier commit sites, via the reusable,
        # tested form of that algorithm (scripts/reset_soft_and_push.sh) rather than a third inline
        # copy of it — there is no template rebuild owed here, unlike those two sites: this file is
        # plain data, never derived from app_template.html.
        if: ${{ github.event.inputs.probe_title == '' }}
        run: |
          git config user.name  "cascade-bot"
          git config user.email "actions@users.noreply.github.com"
          bash scripts/reset_soft_and_push.sh staging true state/user_held_ids.json

      - name: Run the Contact-us digest (CAS-836)
        # Same secrets-present/--dry-run split as the monitor step above: with all three present
        # this sends the real digest and stamps sent_at; without them it renders and sends
        # nothing, so the workflow still passes before the secrets are configured.
        if: ${{ github.event.inputs.probe_title == '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CASCADE_CONTACT_TO: ${{ secrets.CASCADE_CONTACT_TO }}
        run: |
          DRYRUN=""
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || [ -z "$RESEND_API_KEY" ]; then
            DRYRUN="--dry-run"
          fi
          python -m monitor.contact $DRYRUN

      - name: Dispatch qa.yml (CAS-523)
        # The commits above were pushed with the default GITHUB_TOKEN, so GitHub's anti-recursion
        # protection silently suppresses qa.yml's `push` trigger for them — meaning promote.yml's
        # gate would never fire for a daily-refresh-only push. An explicit API dispatch is not
        # subject to that suppression, so this keeps main from drifting behind a staging refresh
        # that has no other ticket push to piggyback on.
        if: ${{ github.event.inputs.probe_title == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run qa.yml --ref staging

      - name: Run nightly health assertions (CAS-974)
        # The literal last step: asserts the night's work actually happened (catalogue size/
        # integrity, TMDB/Watchmode/OscarBase call+error tallies, email/push delivery, a live
        # anon-role usage_events insert, a live canary sign-in) rather than trusting a green
        # workflow. Runs after qa.yml's dispatch above so a health failure here never blocks that
        # unrelated code-quality gate. SUPABASE_ANON_KEY/CASCADE_CANARY_EMAIL/CASCADE_CANARY_
        # PASSWORD are new secrets (Lee's step, CAS-974 hand-off) — until they exist, the two live
        # Supabase checks report "unknown" (tolerated) rather than failing the run.
        if: ${{ github.event.inputs.probe_title == '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CASCADE_CANARY_EMAIL: ${{ secrets.CASCADE_CANARY_EMAIL }}
          CASCADE_CANARY_PASSWORD: ${{ secrets.CASCADE_CANARY_PASSWORD }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
          APNS_AUTH_KEY: ${{ secrets.APNS_AUTH_KEY }}
          APNS_BUNDLE_ID: ${{ secrets.APNS_BUNDLE_ID }}
        run: |
          HEALTH_EXIT=0
          python -m monitor.health || HEALTH_EXIT=$?
          git config user.name  "cascade-bot"
          git config user.email "actions@users.noreply.github.com"
          # Same reset-soft-and-commit retry as the catalogue-sizing step above, minus the rebuild
          # step — state/health.json and state/run_stats.json are plain data, never derived from
          # app_template.html, so there is nothing to regenerate before committing them.
          attempt=1
          pushed=0
          while [ "$attempt" -le 3 ]; do
            git fetch origin staging
            if ! git reset --soft origin/staging; then
              echo "::error::git reset --soft onto origin/staging failed"
              exit 1
            fi
            git checkout HEAD -- . ':!state/health.json' ':!state/run_stats.json'
            git add state/health.json state/run_stats.json
            git commit -m "CAS-974: nightly health report $(date -u +%F)" || echo "nothing to commit"
            if git push origin HEAD:staging; then
              pushed=1
              break
            fi
            echo "push rejected (attempt $attempt/3), retrying after reset"
            attempt=$((attempt + 1))
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::failed to push the health report to staging after 3 attempts"
            exit 1
          fi
          exit $HEALTH_EXIT

  # CAS-973: email someone the moment this workflow breaks, instead of leaving it to be
  # noticed by whoever next opens the Actions tab.
  alert:
    needs: [refresh]
    if: failure()
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/alert.yml
    with:
      workflow_name: "daily"
    secrets:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      CASCADE_EMAIL_FROM: ${{ secrets.CASCADE_EMAIL_FROM }}
      CASCADE_ALERT_TO: ${{ secrets.CASCADE_ALERT_TO }}
